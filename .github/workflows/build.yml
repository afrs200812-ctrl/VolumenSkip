name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk VolumenSkip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VolumenSkip-apk
          path: VolumenSkip.apk
      - name: Publicar descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: VolumenSkip (última versión)
          body: Descarga VolumenSkip.apk e instálalo en tu celular.
          files: VolumenSkip.apk
          make_latest: true
